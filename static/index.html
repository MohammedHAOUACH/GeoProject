<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SamaConcept · GeoProjects</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%233a6ea5'/><circle cx='8' cy='8' r='2.5' fill='%23e8eefc'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="tab-map">
  <nav class="navbar navbar-expand app-navbar">
    <div class="container-fluid px-3 flex-wrap">
      <a class="navbar-brand" href="#">
        <span class="brand-dot"></span>SamaConcept <span class="brand-sub">GeoProjects</span>
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto flex-wrap" id="statsBar" aria-label="Statistiques"></div>
      <button class="btn btn-outline-light btn-sm ms-2" id="btnSync" title="Réindexer les project.yaml dans SQLite (rapide, sans LLM)">
        <span id="btnSyncLabel">⟳ Réindexer</span>
      </button>
      <button class="btn btn-warning btn-sm ms-2 d-none" id="btnExtract" title="Robot AI (LLM) : extraction des métadonnées — très gourmand en ressources">
        <span id="btnExtractLabel">🤖 Extraire (AI)</span>
      </button>
    </div>
  </nav>

  <div class="container-fluid app-main">
    <!-- Onglets mobile : carte / projets (masqués sur grand écran) -->
    <div class="mobile-tabs d-lg-none">
      <button type="button" class="tab-btn active" data-tab="map" id="btnTabMap">🗺 Carte</button>
      <button type="button" class="tab-btn" data-tab="projects" id="btnTabProjects">📋 Projets &amp; filtres</button>
    </div>

    <div class="row g-0 h-100">
      <!-- Panneau latéral gauche : filtres + cartes projets -->
      <aside class="col-12 col-lg-4 col-xxl-3 sidebar" id="sidebar">
        <div class="filters p-3">
          <h6 class="filter-title mb-3">Filtres</h6>

          <div class="mb-3">
            <label class="form-label small text-uppercase text-muted" for="inputSearch">Recherche globale</label>
            <input type="search" class="form-control form-control-sm" id="inputSearch"
                   placeholder="Nom, référence, promoteur, adresse…" autocomplete="off">
          </div>

          <div class="mb-3">
            <label class="form-label small text-uppercase text-muted">Statut du projet</label>
            <div class="d-flex flex-wrap gap-2" id="statutFilters">
              <label class="statut-chip" data-statut="devis"><input type="checkbox" value="devis"> Devis</label>
              <label class="statut-chip" data-statut="en_cours"><input type="checkbox" value="en_cours"> En cours</label>
              <label class="statut-chip" data-statut="finalise"><input type="checkbox" value="finalise"> Finalisé</label>
              <label class="statut-chip" data-statut="livre"><input type="checkbox" value="livre"> Livré</label>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label class="form-label small text-uppercase text-muted" for="inputPromoteur">Promoteur</label>
              <select class="form-select form-select-sm" id="inputPromoteur">
                <option value="">Tous les promoteurs</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label small text-uppercase text-muted" for="inputEtape">Étape actuelle</label>
              <input type="text" class="form-control form-control-sm" id="inputEtape"
                     list="etapeDatalist" placeholder="Ex : structure…" autocomplete="off">
              <datalist id="etapeDatalist"></datalist>
            </div>
          </div>

          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="toggleGps">
            <label class="form-check-label small" for="toggleGps">Projets géolocalisés uniquement</label>
          </div>

          <div class="d-flex align-items-center justify-content-between">
            <button class="btn btn-sm btn-outline-secondary" id="btnReset">Réinitialiser les filtres</button>
            <span class="small text-muted" id="countLabel">—</span>
          </div>
        </div>

        <div class="project-list flex-grow-1 overflow-auto" id="projectList"></div>
      </aside>

      <!-- Zone principale droite : carte vectorielle -->
      <section class="col-12 col-lg-8 col-xxl-9 map-panel position-relative" id="mapPanel">
        <div id="map"></div>
        <div id="tooltip" class="map-tooltip" style="display:none"></div>
        <div class="map-legend">
          <span><i class="dot dot-devis"></i> Devis</span>
          <span><i class="dot dot-en_cours"></i> En cours</span>
          <span><i class="dot dot-finalise"></i> Finalisé / Livré</span>
        </div>
      </section>
    </div>
  </div>

  <!-- Fenêtre de détail d'un projet -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailTitle">Projet</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
