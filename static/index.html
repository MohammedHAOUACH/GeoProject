<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SamaConcept · GeoProjects</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%233a6ea5'/><circle cx='8' cy='8' r='2.5' fill='%23e8eefc'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="tab-map">
  <nav class="navbar navbar-expand app-navbar">
    <div class="container-fluid px-3 flex-wrap">
      <a class="navbar-brand" href="#">
        <span class="brand-logo-wrap">
          <img class="brand-logo" src="/static/logo.png" alt="SamaConcept">
        </span>
        <span class="brand-sub">GeoProjects</span>
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto flex-wrap" id="statsBar" aria-label="Statistiques"></div>
      <button class="btn btn-outline-light btn-sm ms-2" id="btnSync" title="Réindexer les project.yaml dans SQLite (rapide, sans LLM)">
        <span id="btnSyncLabel">⟳ Réindexer</span>
      </button>
      <button class="btn btn-warning btn-sm ms-2 d-none" id="btnExtract" title="Robot AI (LLM) : extraction des métadonnées — très gourmand en ressources">
        <span id="btnExtractIcon" aria-hidden="true">🤖</span>
        <span id="btnExtractLabel">Extraire (AI)</span>
      </button>
    </div>
  </nav>

  <div class="container-fluid app-main">
    <!-- Onglets mobile : carte / projets (masqués sur grand écran) -->
    <div class="mobile-tabs d-lg-none">
      <button type="button" class="tab-btn active" data-tab="map" id="btnTabMap">🗺 Carte</button>
      <button type="button" class="tab-btn" data-tab="projects" id="btnTabProjects">📋 Projets &amp; filtres</button>
    </div>

    <div class="row g-0 h-100">
      <!-- Panneau latéral gauche : filtres + cartes projets -->
      <aside class="col-12 col-lg-4 col-xxl-3 sidebar" id="sidebar">
        <div class="filters">
          <div class="filter-header">
            <div>
              <h6 class="filter-title">Filtres projets</h6>
            </div>
            <span class="filter-count" id="countLabel">—</span>
          </div>

          <div class="filter-body">
            <div class="filter-section filter-search">
              <label class="filter-label" for="inputSearch">Rechercher un projet</label>
              <div class="search-control">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input type="search" class="form-control" id="inputSearch"
                       placeholder="Nom, référence, promoteur…" autocomplete="off">
              </div>
            </div>

            <div class="filter-section">
              <div class="filter-section-heading">
                <label class="filter-label mb-0">Statut du projet</label>
              </div>
              <div class="status-grid" id="statutFilters">
                <label class="statut-chip" data-statut="devis"><input type="checkbox" value="devis"><span class="status-dot"></span> Devis</label>
                <label class="statut-chip" data-statut="en_cours"><input type="checkbox" value="en_cours"><span class="status-dot"></span> En cours</label>
                <label class="statut-chip" data-statut="finalise"><input type="checkbox" value="finalise"><span class="status-dot"></span> Finalisé</label>
                <label class="statut-chip" data-statut="livre"><input type="checkbox" value="livre"><span class="status-dot"></span> Livré</label>
                <label class="statut-chip gps-chip" title="Afficher uniquement les projets géolocalisés">
                  <input type="checkbox" id="toggleGps">
                  <span class="status-dot"></span> Géolocalisés
                </label>
              </div>
            </div>

            <div class="filter-section">
              <div class="row g-3">
                <div class="col-sm-6">
                  <label class="field-label" for="inputPromoteur">Promoteur</label>
                  <select class="form-select" id="inputPromoteur">
                    <option value="">Tous les promoteurs</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label class="field-label" for="inputEtape">Étape actuelle</label>
                  <input type="text" class="form-control" id="inputEtape"
                         list="etapeDatalist" placeholder="Ex. structure" autocomplete="off">
                  <datalist id="etapeDatalist"></datalist>
                </div>
              </div>
            </div>

            <div class="filter-actions">
              <button class="btn btn-sm btn-outline-secondary" id="btnReset">Réinitialiser</button>
            </div>
          </div>
        </div>

        <div class="project-list flex-grow-1 overflow-auto" id="projectList"></div>
      </aside>

      <!-- Zone principale droite : carte vectorielle -->
      <section class="col-12 col-lg-8 col-xxl-9 map-panel position-relative" id="mapPanel">
        <div id="map"></div>
        <div id="tooltip" class="map-tooltip" style="display:none"></div>
        <div class="map-legend">
          <span><i class="dot dot-devis"></i> Devis</span>
          <span><i class="dot dot-en_cours"></i> En cours</span>
          <span><i class="dot dot-finalise"></i> Finalisé / Livré</span>
        </div>
      </section>
    </div>
  </div>

  <!-- Fenêtre de détail d'un projet -->
  <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailTitle">Projet</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
